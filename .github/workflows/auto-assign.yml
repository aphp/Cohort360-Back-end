name: auto-assign

on:
  pull_request:
    branches:
      - develop
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign-author:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Assign the pull request to its author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: gh pr edit "$PR_NUMBER" --repo "$REPO" --add-assignee "$AUTHOR"
